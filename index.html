h+=`<g class="nt" id="n${i}"><ellipse cx="${x}" cy="${y}" rx="14" ry="10" transform="rotate(-20 ${x} ${y})"/><line x1="${up?x+13:x-13}" x2="${up?x+13:x-13}" y1="${y}" y2="${up?y-62:y+62}"/>${n.acc?`<text x="${x-40}" y="${y+10}">${n.acc>0?"♯":"♭"}</text>`:""}</g>`});
return h+"</svg>"}
const bd=()=>O.oct=="great"?[14,20]:O.oct=="mix"?[14,27]:[21,27];
function mk(pos){let a=0;if(O.alt&&Math.random()<.5){const l=pos%7,c=[];if([0,1,3,4,5].includes(l))c.push(1);if([1,2,4,5,6].includes(l))c.push(-1);a=c[R(c.length)]}return{pos,acc:a}}
const rn=()=>{const[a,b]=bd();return mk(a+R(b-a+1))};
function kbStrip(){let w="",b="";const start=0,end=23;for(let i=0;i<52;i++){const hi=i>=start&&i<end;w+=`<rect class="${hi?"key-active":""}" x="${i*20}" width="20" height="90" rx="1" fill="${hi?"#ffe68a":"#fff"}" stroke="${hi?"#8b6b22":"#2a2146"}" stroke-width="${hi?1.5:1}"/>`}
for(let i=0;i<51;i++){const hasBlack=i==0||(i>=2&&[0,1,3,4,5].includes((i-2)%7));if(hasBlack){const hi=i>=start&&i<end;b+=`<rect class="${hi?"black-active":""}" x="${(i+1)*20-6}" width="12" height="54" rx="2" fill="${hi?"#39246d":"#1b1038"}" stroke="${hi?"#c8a9ff":"#2a2146"}" stroke-width="${hi?1.4:1}"/>`}}
return`<svg role="img" aria-label="${T().p2}" viewBox="0 0 1040 90" preserveAspectRatio="none">${w}${b}</svg>`}
function kb(p){let w="",b="";PC.forEach((c,i)=>w+=`<rect x="${i*34}" width="34" height="90" fill="${c==p?"#dbd65c":"#fff"}" stroke="#2a2146"/>`);
[1,3,6,8,10].forEach((c,j)=>b+=`<rect x="${([0,1,3,4,5][j]+1)*34-10}" width="20" height="54" fill="${c==p?"#dbd65c":"#1b1038"}" stroke="#2a2146"/>`);return`<svg viewBox="0 0 238 90">${w}${b}</svg>`}
function nav(){const t=T();$("#nav").innerHTML=t.nav.map((n,i)=>`<button data-a="nav" data-v="${i?i-1:"home"}" class="${(i?i-1:"home")==V?"on":""}">${i?IC[i-1]+" ":""}${n}</button>`).join("");
document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l==lang));$("#foot").innerHTML=`${t.foot}<br><a href="https://instagram.com/brio_musicstudio">Instagram</a><a href="https://t.me/briomusicstudio">Telegram</a><a href="https://tiktok.com/@brio_music_studio_">TikTok</a>`;document.documentElement.lang=lang}
function render(){nav();clearInterval(tid);V=="home"?home():setup();scrollTo(0,0)}
function home(){const t=T(),keyStart=0,keyEnd=23/52*100;$("#app").innerHTML=`<section class="hero"><div><h1>${t.title}</h1><p>${t.p1}</p><p>${t.p2}</p><div class="kbc">${kbStrip()}<span class="key-label start" style="left:${keyStart}%">${t.s}</span><span class="key-label end" style="left:${keyEnd}%">${t.e}</span></div><button class="cta" data-a="scr">${t.choose} ↓</button></div><div class="glow"><img src="clef.png" alt=""></div></section>
<section class="grid" id="games">${t.cards.map((c,i)=>`<div class="card gc"><span class="ic">${IC[i]}</span><h3>${c[0]}</h3><p>${c[1]}</p><button class="cta" data-a="nav" data-v="${i}">${t.play}</button></div>`).join("")}</section>`}
function setup(){const t=T();ph="setup";const op=[["great",1],["mix",2],["alt",3]];
$("#app").innerHTML=`<div class="card setup"><div class="hd"><span class="ic">${IC[V]}</span><div><h2>${t.cards[V][0]}</h2><p>${t.cards[V][1]}</p></div></div>
<fieldset><legend>⏱ ${t.time}</legend><div class="tms">${[30,60,90,120,0].map((s,i)=>`<button data-a="t" data-v="${s}" class="${O.time==s?"on":""}">${t.t[i]}</button>`).join("")}</div></fieldset>
<fieldset><legend>★ ${t.diff} <small>— ${t.dh}</small></legend>${op.map(([k,s],i)=>`<button class="opt ${(k=="alt"?O.alt:O.oct==k)?"on":""}" data-a="o" data-v="${k}"><span><b>${t.o[i][0]}</b><small>${t.o[i][1]}</small></span><i>${"★".repeat(s)}${"☆".repeat(3-s)}</i></button>`).join("")}</fieldset>
<button class="cta go" data-a="start">▶ ${t.go}</button></div>`}
function begin(){const t=T();ph="play";G={n:0,s:0,left:O.time,busy:0};clearInterval(tid);
$("#app").innerHTML=`<div class="bar"><span>${t.res}:</span><span class="pill" id="sc">0/10</span><div class="stars" id="stars">${"<i>★</i>".repeat(10)}</div><span class="pill" id="tm"></span></div><h2 class="qt">${t.q[V]}</h2><div id="st"></div>`;
tm();if(O.time)tid=setInterval(()=>{G.left--;tm();if(G.left<=0)end()},1000);q()}
function tm(){$("#tm").textContent=O.time?"⏱ "+Math.floor(G.left/60)+":"+String(G.left%60).padStart(2,"0"):"∞"}
function ans(ok){if(G.busy)return;G.busy=1;if(ok){G.s++;$("#sc").textContent=G.s+"/10";document.querySelectorAll("#stars i").forEach((e,i)=>e.className=i<G.s?"f":"")}
setTimeout(()=>{if(ph!="play")return;G.n++;G.busy=0;G.n>=10?end():q()},ok?700:1400)}
function end(){clearInterval(tid);ph="end";const t=T();$("#app").innerHTML=`<div class="card end"><h2>${t.fin}</h2><div class="stars">${[...Array(10)].map((_,i)=>`<i class="${i<G.s?"f":""}">★</i>`).join("")}</div><p>${t.res}: ${G.s}/10. ${t.m[G.s>=9?2:G.s>=6?1:0]}</p><button class="cta" data-a="start">${t.again}</button><button class="cta g" data-a="nav" data-v="home">${t.menu}</button></div>`}
const q=()=>[qN,qK,qM,qP][V]();
function qN(){const n=rn(),a=[{l:n.pos%7,a:n.acc}],s=new Set([kk(a[0].l,a[0].a)]);
while(a.length<6){const l=R(7),c=O.alt?[-1,0,1][R(3)]:0;if(!s.has(kk(l,c))){s.add(kk(l,c));a.push({l,a:c})}}
Q={n};$("#st").innerHTML=`<div class="two"><div class="card sc">${staff([n])}</div><div class="opts">${sh(a).map(o=>`<button data-a="ans" data-k="${kk(o.l,o.a)}">${nm(o.l,o.a)}</button>`).join("")}</div></div>`}
function qK(){const n=rn(),c=pcOf(n),p=O.alt?[...Array(12).keys()]:PC,o=[c];while(o.length<3){const x=p[R(p.length)];if(!o.includes(x))o.push(x)}
Q={n,o:sh(o)};$("#st").innerHTML=`<div class="two"><div class="card sc drop">${staff([n])}<small>${T().drop}</small></div><div class="kbs">${Q.o.map((p,i)=>`<div class="kb" draggable="true" data-a="kb" data-i="${i}">${kb(p)}</div>`).join("")}</div></div>`}
function mel(k){const[a,b]=bd();let p=a+R(b-a+1);return[...Array(k)].map(()=>{const r=mk(p);p=Math.max(a,Math.min(b,p+[-2,-1,1,2][R(4)]));return r})}
function qM(){Q={ns:mel(4),a:[],mod:0};$("#st").innerHTML=`<div class="card sc" style="margin:auto">${staff(Q.ns)}</div><div class="sl" id="sl">${"<span>·</span>".repeat(4)}</div><div class="fix" id="fx"></div><div class="ml">${T().nm.map((n,i)=>`<button class="lt" data-a="ml" data-v="${i}">${n}</button>`).join("")}${O.alt?`<button class="lt" id="m1" data-a="md" data-v="1">♯</button><button class="lt" id="m2" data-a="md" data-v="-1">♭</button>`:""}<button class="lt" data-a="del">⌫</button></div>`}
function qP(){Q={ns:mel(4)};$("#st").innerHTML=`<div class="two"><div class="card sc">${staff(Q.ns)}<button class="lis" data-a="lis">▶ ${T().lis}</button></div><div class="tc"><button class="rb ok" data-a="yes">✓</button><button class="rb no" data-a="nop">✕</button></div></div>`}
function pick(i){if(G.busy)return;const ok=Q.o[i]==pcOf(Q.n);tone(Q.n);document.querySelectorAll(".kb")[i].classList.add(ok?"ok":"no");if(!ok)document.querySelectorAll(".kb")[Q.o.indexOf(pcOf(Q.n))].classList.add("ok");ans(ok)}
function sl(){document.querySelectorAll("#sl span").forEach((e,i)=>e.textContent=Q.a[i]?nm(Q.a[i].l,Q.a[i].a):"·")}
const app=$("#app");
document.onclick=e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;
if(a=="nav"){V=v=="home"?v:+v;render()}
else if(a=="scr")$("#games").scrollIntoView({behavior:"smooth"});
else if(a=="t"){O.time=+v;setup()}
else if(a=="o"){v=="alt"?O.alt=!O.alt:O.oct=O.oct==v?"small":v;setup()}
else if(a=="start")begin();
else if(a=="ans"&&!G.busy){const ok=b.dataset.k==kk(Q.n.pos%7,Q.n.acc);tone(Q.n);b.classList.add(ok?"ok":"no");if(!ok)document.querySelector(`[data-k="${kk(Q.n.pos%7,Q.n.acc)}"]`).classList.add("ok");document.getElementById("n0").classList.add(ok?"ok":"no");ans(ok)}
else if(a=="kb")pick(+b.dataset.i);
else if(a=="ml"&&!G.busy&&Q.a.length<4){Q.a.push({l:+v,a:Q.mod});Q.mod=0;["m1","m2"].forEach(i=>$("#"+i)&&$("#"+i).classList.remove("on"));sl();
if(Q.a.length==4){const r=Q.a.map((x,i)=>x.l==Q.ns[i].pos%7&&x.a==Q.ns[i].acc),ok=r.every(Boolean);document.querySelectorAll("#sl span").forEach((s,i)=>s.classList.add(r[i]?"ok":"no"));if(!ok)$("#fx").textContent=Q.ns.map(n=>nm(n.pos%7,n.acc)).join(" – ");Q.ns.forEach((n,i)=>tone(n,i*.45));ans(ok)}}
else if(a=="md"&&!G.busy){Q.mod=Q.mod==+v?0:+v;$("#m1").classList.toggle("on",Q.mod==1);$("#m2").classList.toggle("on",Q.mod==-1)}
else if(a=="del"&&!G.busy){Q.a.pop();sl()}
else if(a=="lis")Q.ns.forEach((n,i)=>tone(n,i*.55));
else if(a=="yes"||a=="nop")ans(a=="yes")};
app.ondragover=e=>{if(e.target.closest(".drop"))e.preventDefault()};
app.ondragstart=e=>{const k=e.target.closest(".kb");if(k)e.dataTransfer.setData("text/plain",k.dataset.i)};
app.ondrop=e=>{if(e.target.closest(".drop")){e.preventDefault();pick(+e.dataTransfer.getData("text/plain"))}};
$("#lang").onclick=e=>{const l=e.target.dataset.l;if(!l)return;lang=l;try{localStorage.lang=l}catch(x){}render()};
$("#vol").oninput=e=>vol=+e.target.value;
render();
</script></body></html>
